    <script>
      (() => {
        const fallback = "Kalyan Nagar";
        const allowedLocations = new Set([
          "Kalyan Nagar",
          "Kammanahalli",
          "Banaswadi",
          "Bengaluru",
          "Bangalore",
          "HRBR Layout",
          "Kasturi Nagar",
          "Hennur",
        ]);
        const titleCase = (value) =>
          value
            .trim()
            .replace(/[^a-zA-Z\s-]/g, "")
            .replace(/\s+/g, " ")
            .toLowerCase()
            .replace(/(^|[\s-])[a-z]/g, (letter) => letter.toUpperCase());
        const applyLocation = () => {
          const requested = new URLSearchParams(window.location.search).get("loc");
          const location = titleCase(requested || "");
          const safeLocation = allowedLocations.has(location) ? location : fallback;
          document.querySelectorAll(".dki-loc").forEach((element) => {
            element.textContent = safeLocation;
          });
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", applyLocation, { once: true });
        } else {
          applyLocation();
        }
      })();
    </script>
